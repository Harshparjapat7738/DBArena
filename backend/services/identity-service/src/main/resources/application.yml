spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true # backend/CLAUDE.md: every service doing blocking I/O runs on virtual threads

server:
  port: ${PORT:8081}

dbarena:
  security:
    jwt:
      secret: ${DBArena_JWT_SECRET:} # required - HS256, >= 32 bytes. Never commit a real value.
  identity:
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    mongo-uri: ${DBArena_IDENTITY_MONGO_URI:mongodb://localhost:27017}
    mongo-database: ${DBArena_IDENTITY_MONGO_DATABASE:DBArena_identity}

# Mongock (Mongo migrations - see catalog-service's ChangeLog001CreateProblemsIndexes
# Javadoc for why this block carries above-average reconstructed-API risk).
mongock:
  migration-scan-package:
    - com.DBArena.services.identity.mongock
  mongo-db:
    uri: ${DBArena_IDENTITY_MONGO_URI:mongodb://localhost:27017}
    database: ${DBArena_IDENTITY_MONGO_DATABASE:DBArena_identity}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
