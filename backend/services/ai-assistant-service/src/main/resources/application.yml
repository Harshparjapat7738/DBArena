spring:
  application:
    name: ai-assistant-service
  threads:
    virtual:
      enabled: true # backend/CLAUDE.md: every service doing blocking I/O runs on virtual threads

server:
  port: ${PORT:8084}

dbforge:
  security:
    jwt:
      secret: ${DBFORGE_JWT_SECRET:} # must match every backend service's secret - same signer, many verifiers
  ai:
    catalog-service-uri: ${DBFORGE_CATALOG_SERVICE_URI:http://localhost:8083} # Feign target, called directly - not through api-gateway (hard rule #2, service-to-service)
    # Repo layout: backend/services/ai-assistant-service/ -> ../../../datasets is the
    # repo-root datasets/ directory (see M02). Assumes the process cwd is this module's
    # own directory (mvn's default for `spring-boot:run`) - unverified end-to-end without
    # a real run, same standing caveat as every prior milestone's reconstructed-from-memory
    # risk areas (see this milestone's Session Log "Carried forward").
    datasets-root: ${DBFORGE_DATASETS_ROOT:../../../datasets}
    max-output-tokens: ${DBFORGE_AI_MAX_OUTPUT_TOKENS:220}
    groq:
      api-key: ${DBFORGE_GROQ_API_KEY:}
      base-url: ${DBFORGE_GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
      model: ${DBFORGE_GROQ_MODEL:llama-3.3-70b-versatile}
      timeout-ms: ${DBFORGE_GROQ_TIMEOUT_MS:8000}
    gemini:
      api-key: ${DBFORGE_GEMINI_API_KEY:}
      base-url: ${DBFORGE_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
      model: ${DBFORGE_GEMINI_MODEL:gemini-3-flash-preview}
      timeout-ms: ${DBFORGE_GEMINI_TIMEOUT_MS:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
