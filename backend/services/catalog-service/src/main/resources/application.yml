spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true # backend/CLAUDE.md: every service doing blocking I/O runs on virtual threads

server:
  port: ${PORT:8083}

dbarena:
  security:
    jwt:
      secret: ${DBArena_JWT_SECRET:} # must match every backend service's secret - same signer, many verifiers
  catalog:
    mongo-uri: ${DBArena_CATALOG_MONGO_URI:mongodb://localhost:27017}
    mongo-database: ${DBArena_CATALOG_MONGO_DATABASE:DBArena_catalog}

# Mongock (Mongo migrations - see ChangeLog001CreateProblemsIndexes's Javadoc
# for why this block carries above-average reconstructed-API risk).
mongock:
  migration-scan-package:
    - com.DBArena.services.catalog.mongock
  mongo-db:
    uri: ${DBArena_CATALOG_MONGO_URI:mongodb://localhost:27017}
    database: ${DBArena_CATALOG_MONGO_DATABASE:DBArena_catalog}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
